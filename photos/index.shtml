<!-- 使用 Staticfile CDN -->
<link rel="stylesheet" href="https://cdn.staticfile.net/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdn.staticfile.net/leaflet/1.9.4/leaflet.min.js"></script>

<!-- Font Awesome 图标 -->

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Microsoft YaHei','微软雅黑','PingFang SC',sans-serif;color:#333;line-height:1.6;height:100vh;overflow:hidden;}

/* 全屏地图 */
#map{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;}

/* 顶部导航栏 - 全宽置顶 */
.header{background: rgba(255,255,255,0.98);backdrop-filter: blur(10px);box-shadow:0 2px 15px rgba(0,0,0,0.1);position:fixed;top:0;left:0;right:0;z-index:1000;height:60px;border-bottom:1px solid rgba(52,152,219,0.1);}
.nav-container{max-width:100%;margin:0 auto;display:flex;justify-content:space-between;align-items:center;height:100%;padding:0 30px;}
.logo{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:700;color:#2c3e50;cursor:pointer;transition:color 0.3s;}
.logo:hover{color:#3498db;}
.logo i{color:#3498db;}
.nav-links{display:flex;gap:40px;align-items:center;}
.nav-links a{color:#5a6c7d;text-decoration:none;font-weight:500;font-size:16px;transition:all 0.3s;padding:8px 0;position:relative;white-space:nowrap;}
.nav-links a:hover{color:#3498db;}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:2px;background:#3498db;transition:width 0.3s;}
.nav-links a:hover::after{width:100%;}
.nav-actions{display:flex;gap:15px;align-items:center;}
.btn{background:#3498db;color:white;border:none;padding:8px 20px;border-radius:6px;font-weight:600;cursor:pointer;transition:all 0.3s;font-size:14px;}
.btn:hover{background:#2980b9;transform:translateY(-2px);box-shadow:0 5px 15px rgba(52,152,219,0.3);}

/* 地图图例 */
.map-legend{position:fixed;top:80px;right:20px;z-index:1000;background:rgba(255,255,255,0.95);backdrop-filter:blur(5px);border-radius:12px;padding:16px;box-shadow:0 5px 15px rgba(0,0,0,0.1);border:1px solid rgba(52,152,219,0.2);color:#2c3e50;font-size:14px;max-width:200px;}
.map-legend h3{margin-bottom:10px;font-size:16px;color:#3498db;border-bottom:2px solid #3498db;padding-bottom:5px;}
.legend-item{display:flex;align-items:center;margin:8px 0;}
.legend-icon{width:24px;height:24px;margin-right:10px;display:flex;align-items:center;justify-content:center;}
.legend-count{margin-top:10px;padding-top:10px;border-top:1px solid #eee;font-size:13px;color:#7f8c8d;}

/* 红色箭头标记 */
.red-arrow svg{animation:arrowFloat 2s ease-in-out infinite;}
@keyframes arrowFloat{0%{transform:translateY(0);}50%{transform:translateY(-6px);}100%{transform:translateY(0);}}

/* 图集 Overlay */
#galleryOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:5000;padding:20px;}
#gallery{background:white;border-radius:20px;padding:30px;max-width:min(1400px,96vw);max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,0.2);position:relative;}
#gallery h2{color:#2c3e50;text-align:center;margin-bottom:10px;font-size:28px;border-bottom:3px solid #3498db;padding-bottom:15px;}
#galleryDesc{color:#7f8c8d;text-align:center;margin-bottom:25px;font-size:16px;}

/* 照片网格 */
.photos{display:grid;grid-template-columns:repeat(4, 1fr);gap:20px;margin-bottom:20px;}
.photo-item{background:#f8f9fa;border-radius:12px;overflow:hidden;transition:all 0.3s;border:1px solid #eee;position:relative;}
.photo-item:hover{transform:translateY(-5px);box-shadow:0 10px 20px rgba(52,152,219,0.2);}
.photo-item img{width:100%;height:200px;object-fit:cover;cursor:pointer;}
.photo-info{padding:15px;text-align:center;}
.photo-info .date{color:#3498db;font-weight:600;font-size:14px;}
.photo-info .caption{color:#5a6c7d;font-size:13px;margin-top:5px;}
.closeBtn{width:100%;margin-top:25px;padding:15px 0;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg, #3498db, #2980b9);color:#fff;font-weight:600;font-size:16px;transition:all 0.3s;}
.closeBtn:hover{background:linear-gradient(135deg, #2980b9, #1c6ea4);transform:translateY(-2px);box-shadow:0 5px 15px rgba(52,152,219,0.3);}

/* 头像样式 */
.avatar-img {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid #3498db;
}

/* 瀑布流相册 */
#waterfallOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.95);backdrop-filter:blur(8px);display:none;z-index:4000;overflow-y:auto;padding:80px 20px 20px;}
.waterfall-container{max-width:1600px;margin:0 auto;}
.waterfall-header{color:white;text-align:center;margin-bottom:30px;}
.waterfall-header h2{font-size:32px;margin-bottom:10px;}
.waterfall-header p{color:#ccc;font-size:16px;}
.close-waterfall{position:fixed;top:20px;right:20px;background:rgba(255,255,255,0.2);border:none;color:white;width:50px;height:50px;border-radius:50%;font-size:24px;cursor:pointer;z-index:4001;transition:all 0.3s;}
.close-waterfall:hover{background:rgba(255,255,255,0.3);transform:scale(1.1);}

/* 瀑布流布局 */
.waterfall-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}

.waterfall-item {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  background: #222;
  transition: all 0.4s;
  height: 320px;
}

.waterfall-item:hover {
  transform: translateY(-8px);
  box-shadow: 0 15px 30px rgba(0,0,0,0.5);
}

.waterfall-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  cursor: pointer;
}

.waterfall-info {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  color: white;
  padding: 20px 15px 15px;
  transform: translateY(100%);
  transition: transform 0.3s;
}

.waterfall-item:hover .waterfall-info {
  transform: translateY(0);
}

.waterfall-info .city {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 5px;
}

.waterfall-info .caption {
  font-size: 14px;
  color: #ddd;
  margin-bottom: 5px;
}

.waterfall-info .date {
  font-size: 12px;
  color: #aaa;
}

/* 加载指示器样式 */
.loading-indicator {
  text-align: center;
  padding: 30px;
  color: #ddd;
  font-size: 14px;
  display: none;
}

.loading-indicator .loading {
  display: inline-block;
  width: 16px;
  height: 16px;
  margin-right: 8px;
  border: 2px solid rgba(52,152,219,0.3);
  border-radius: 50%;
  border-top-color: #3498db;
  animation: spin 1s linear infinite;
}

/* 分页按钮 - 美化版 */
.pagination-container{display:flex;justify-content:center;align-items:center;gap:15px;margin-top:25px;}
.pagination-btn{background:#3498db;color:white;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 10px rgba(52,152,219,0.3);}
.pagination-btn:hover:not(:disabled){background:#2980b9;transform:translateY(-2px) scale(1.1);box-shadow:0 5px 15px rgba(52,152,219,0.4);}
.pagination-btn:disabled{background:#bdc3c7;cursor:not-allowed;opacity:0.6;transform:none;box-shadow:none;}
.page-info{color:#5a6c7d;font-size:14px;font-weight:500;}

/* Lightbox - 透明磨砂效果箭头 */
#lightboxOverlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:6000;}
#lightboxOverlay img{max-width:90vw;max-height:85vh;border-radius:12px;box-shadow:0 15px 40px rgba(0,0,0,0.3);}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);font-size:36px;font-weight:700;padding:15px 20px;cursor:pointer;color:#fff;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:12px;transition:all 0.3s;border:1px solid rgba(255,255,255,0.2);box-shadow:0 8px 32px rgba(0,0,0,0.3);}
.lightbox-nav:hover{background:rgba(255,255,255,0.25);transform:translateY(-50%) scale(1.1);box-shadow:0 12px 40px rgba(0,0,0,0.4);}
#lightbox-prev{left:40px;} #lightbox-next{right:40px;}

/* 自定义弹出窗口样式 */
.leaflet-popup-content-wrapper {
  background: white;
  border-radius: 12px;
  color: #2c3e50;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  border: 1px solid rgba(52,152,219,0.2);
}

.leaflet-popup-tip {
  background: white;
  border: 1px solid rgba(52,152,219,0.2);
}

.leaflet-popup-content {
  font-family: 'Microsoft YaHei','微软雅黑',sans-serif;
  font-size: 14px;
}

/* 隐藏Leaflet默认控件 */
.leaflet-control-zoom {
  display: none !important;
}

.leaflet-control-attribution {
  font-size: 11px;
  color: #666;
  background: rgba(255,255,255,0.8);
  padding: 2px 8px;
  border-radius: 4px;
}

/* 加载动画 */
@keyframes spin {
  to { transform: rotate(360deg); }
}

/* 响应式设计 */
@media (max-width:1200px){
  .photos{grid-template-columns:repeat(3, 1fr);}
  .waterfall-grid{grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));}
  .waterfall-item{height: 300px;}
}

@media (max-width:1024px){
  .nav-links{gap:25px;}
  .nav-container{padding:0 20px;}
  .lightbox-nav{font-size:32px;padding:12px 16px;}
  #lightbox-prev{left:20px;} #lightbox-next{right:20px;}
}

@media (max-width:768px){
  .nav-container{flex-direction:column;height:auto;padding:10px;}
  .nav-links{gap:15px;margin:10px 0;flex-wrap:wrap;justify-content:center;}
  .logo{margin-bottom:5px;}
  .map-legend{top:140px;max-width:160px;padding:12px;font-size:12px;}
  .photos{grid-template-columns:repeat(2, 1fr);}
  .lightbox-nav{font-size:28px;padding:10px 14px;}
  #lightbox-prev{left:15px;} #lightbox-next{right:15px;}
  .waterfall-grid{grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));}
  .waterfall-item{height: 280px;}
  #waterfallOverlay{padding:70px 10px 10px;}
}

@media (max-width:480px){
  .nav-links{gap:10px;}
  .nav-links a{font-size:14px;}
  .btn{padding:6px 15px;font-size:13px;}
  .map-legend{top:150px;right:10px;}
  .photos{grid-template-columns:1fr;}
  .lightbox-nav{font-size:24px;padding:8px 12px;}
  .waterfall-grid{grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));}
  .waterfall-item{height: 250px;}
  .waterfall-header h2{font-size:24px;}
  .waterfall-header p{font-size:14px;}
}
</style>

// ====================== 瀑布流相册相关变量 ======================
let waterfallPhotos = [];
let waterfallCurrentIndex = 0;
let photosLoaded = 0;
const photosPerLoad = 12;
let isLoading = false;
let hasMorePhotos = true;

// ====================== 批量生成照片数据函数 ======================
function generateCityPhotos() {
  // 清空瀑布流照片数组
  waterfallPhotos = [];
  
  places.forEach((place, index) => {
    const cityPhotos = photoConfig.cityPhotos[place.id];
    if (cityPhotos) {
      place.photos = cityPhotos.map((photo) => {
        // 生成随机日期
        const month = String(Math.floor(Math.random() * 12) + 1).padStart(2, '0');
        const day = String(Math.floor(Math.random() * 28) + 1).padStart(2, '0');
        
        // 创建照片对象
        const photoObj = {
          src: photoConfig.baseUrl + photo.id + '.jpg',
          time: `${place.visitedYear}-${month}-${day}`,
          caption: photo.caption,
          cityId: place.id,
          cityName: place.name
        };
        
        // 添加到瀑布流照片数组中
        waterfallPhotos.push(photoObj);
        
        return photoObj;
      });
    } else {
      // 如果没有配置照片，使用默认照片
      place.photos = [
        {
          src: photoConfig.baseUrl + '694a813fb65a54c49ff20757.jpg',
          time: `${place.visitedYear}-05-15`,
          caption: `${place.name}风光`,
          cityId: place.id,
          cityName: place.name
        }
      ];
      
      // 添加到瀑布流照片数组中
      waterfallPhotos.push(place.photos[0]);
    }
  });
  
  // 打乱瀑布流照片顺序
  shuffleArray(waterfallPhotos);
  
  // 更新照片总数
  document.getElementById('totalPhotosCount').textContent = waterfallPhotos.length;
}

// 打乱数组函数
function shuffleArray(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

// ====================== 瀑布流相册功能 ======================
function openWaterfallGallery() {
  const overlay = document.getElementById('waterfallOverlay');
  overlay.style.display = 'block';
  document.body.style.overflow = 'hidden';
  
  // 重置加载状态
  photosLoaded = 0;
  isLoading = false;
  hasMorePhotos = true;
  
  // 清空现有内容
  const grid = document.getElementById('waterfallGrid');
  grid.innerHTML = '';
  
  // 滚动到顶部
  overlay.scrollTop = 0;
  
  // 添加滚动监听
  overlay.addEventListener('scroll', handleWaterfallScroll);
  
  // 加载第一批照片
  loadMorePhotosAuto();
}

function closeWaterfallGallery() {
  const overlay = document.getElementById('waterfallOverlay');
  overlay.style.display = 'none';
  document.body.style.overflow = '';
  
  // 移除滚动监听
  overlay.removeEventListener('scroll', handleWaterfallScroll);
}

// 滚动处理函数
function handleWaterfallScroll() {
  const overlay = document.getElementById('waterfallOverlay');
  
  // 自动加载更多照片
  if (!isLoading && hasMorePhotos) {
    const scrollBottom = overlay.scrollHeight - overlay.scrollTop - overlay.clientHeight;
    if (scrollBottom < 500) {
      loadMorePhotosAuto();
    }
  }
}

// 自动加载照片函数
function loadMorePhotosAuto() {
  if (isLoading || !hasMorePhotos) return;
  
  isLoading = true;
  
  // 显示加载指示器
  let loadingIndicator = document.getElementById('loadingIndicator');
  if (!loadingIndicator) {
    loadingIndicator = document.createElement('div');
    loadingIndicator.id = 'loadingIndicator';
    loadingIndicator.className = 'loading-indicator';
    loadingIndicator.innerHTML = '<span class="loading"></span> 加载更多照片...';
    document.querySelector('.waterfall-container').appendChild(loadingIndicator);
  }
  loadingIndicator.style.display = 'block';
  
  // 模拟加载延迟
  setTimeout(() => {
    const grid = document.getElementById('waterfallGrid');
    const startIndex = photosLoaded;
    const endIndex = Math.min(startIndex + photosPerLoad, waterfallPhotos.length);
    
    // 创建图片元素并添加到网格
    for (let i = startIndex; i < endIndex; i++) {
      const photo = waterfallPhotos[i];
      const item = createWaterfallItem(photo, i);
      grid.appendChild(item);
    }
    
    // 更新已加载数量
    photosLoaded = endIndex;
    
    // 更新是否有更多照片
    hasMorePhotos = photosLoaded < waterfallPhotos.length;
    
    // 隐藏加载指示器
    if (loadingIndicator) {
      loadingIndicator.style.display = 'none';
    }
    
    isLoading = false;
    
    // 如果还有更多照片，并且用户已经滚动到底部附近，继续加载
    if (hasMorePhotos) {
      const overlay = document.getElementById('waterfallOverlay');
      const scrollBottom = overlay.scrollHeight - overlay.scrollTop - overlay.clientHeight;
      if (scrollBottom < 800) {
        setTimeout(() => loadMorePhotosAuto(), 300);
      }
    }
  }, 800);
}

function createWaterfallItem(photo, index) {
  const item = document.createElement('div');
  item.className = 'waterfall-item';
  
  const img = document.createElement('img');
  img.src = photo.src;
  img.alt = photo.caption;
  img.loading = 'lazy';
  
  const info = document.createElement('div');
  info.className = 'waterfall-info';
  info.innerHTML = `
    <div class="city">${photo.cityName}</div>
    <div class="caption">${photo.caption}</div>
    <div class="date">${photo.time}</div>
  `;
  
  img.onclick = () => {
    waterfallCurrentIndex = index;
    openLightboxFromWaterfall();
  };
  
  item.appendChild(img);
  item.appendChild(info);
  return item;
}

function openLightboxFromWaterfall() {
  const photo = waterfallPhotos[waterfallCurrentIndex];
  const overlayLb = document.getElementById('lightboxOverlay');
  const lbImg = document.getElementById('lightboxImg');
  
  lbImg.src = '';
  lbImg.style.display = 'none';
  overlayLb.style.display = 'flex';
  
  const img = new Image();
  img.onload = () => {
    lbImg.src = photo.src;
    lbImg.style.display = 'block';
  };
  img.onerror = () => {
    lbImg.src = photo.src;
    lbImg.style.display = 'block';
  };
  img.src = photo.src;
}

function showNextFromWaterfall() {
  waterfallCurrentIndex = (waterfallCurrentIndex + 1) % waterfallPhotos.length;
  openLightboxFromWaterfall();
}

function showPrevFromWaterfall() {
  waterfallCurrentIndex = (waterfallCurrentIndex - 1 + waterfallPhotos.length) % waterfallPhotos.length;
  openLightboxFromWaterfall();
}

    const div = document.createElement('div');
    div.className = 'photo-item';
    
    const img = document.createElement('img');
    img.src = photo.src;
    img.alt = `${place.name} - ${photo.caption}`;
    img.onclick = () => openLightbox(start + i);
    
    const info = document.createElement('div');
    info.className = 'photo-info';
    info.innerHTML = `<div class="date">${photo.time}</div><div class="caption">${photo.caption}</div>`;
    
    div.appendChild(img);
    div.appendChild(info);
    photosEl.appendChild(div);
  });

  // 更新分页信息
  updatePagination(totalPages, place.photos.length);
}

// 更新分页控件
function updatePagination(totalPages, totalPhotos) {
  const currentPageNum = currentPage + 1;
  
  // 更新页面信息
  pageInfoEl.textContent = `第 ${currentPageNum} 页 / 共 ${totalPages} 页 (${totalPhotos}张照片)`;
  
  // 更新按钮状态
  prevPageBtn.disabled = currentPage === 0;
  nextPageBtn.disabled = currentPage >= totalPages - 1;
  
  // 设置分页按钮点击事件
  prevPageBtn.onclick = () => {
    if (currentPage > 0) {
      currentPage--;
      renderGalleryPage(currentPlace);
    }
  };
  
  nextPageBtn.onclick = () => {
    if (currentPage < Math.ceil(currentPlace.photos.length / photosPerPage) - 1) {
      currentPage++;
      renderGalleryPage(currentPlace);
    }
  };
  
  // 显示/隐藏分页容器
  paginationContainer.style.display = totalPages > 1 ? 'flex' : 'none';
}

function closeGallery() {
  overlay.style.display = 'none';
}

overlay.addEventListener('click', e => {
  if (e.target === overlay) closeGallery();
});

// ====================== Lightbox ======================
const overlayLb = document.getElementById('lightboxOverlay');
const lbImg = document.getElementById('lightboxImg');

function openLightbox(i) {
  currentIndex = i;
  
  // 显示加载指示器
  lbImg.src = '';
  lbImg.style.display = 'none';
  overlayLb.style.display = 'flex';
  
  // 预加载大图
  const img = new Image();
  img.onload = () => {
    lbImg.src = currentPlace.photos[currentIndex].src;
    lbImg.style.display = 'block';
  };
  img.onerror = () => {
    // 如果大图加载失败，使用中等图
    lbImg.src = currentPlace.photos[currentIndex].src;
    lbImg.style.display = 'block';
  };
  img.src = currentPlace.photos[currentIndex].src;
}

function closeLightbox() {
  overlayLb.style.display = 'none';
}

function showNext() {
  currentIndex = (currentIndex + 1) % currentPlace.photos.length;
  openLightbox(currentIndex);
}

function showPrev() {
  currentIndex = (currentIndex - 1 + currentPlace.photos.length) % currentPlace.photos.length;
  openLightbox(currentIndex);
}

// 更新Lightbox导航按钮事件
document.getElementById('lightbox-next').onclick = e => { 
  e.stopPropagation(); 
  if (overlay.style.display === 'flex') {
    showNext();
  } else {
    showNextFromWaterfall();
  }
}
document.getElementById('lightbox-prev').onclick = e => { 
  e.stopPropagation(); 
  if (overlay.style.display === 'flex') {
    showPrev();
  } else {
    showPrevFromWaterfall();
  }
}

overlayLb.onclick = e => { if (e.target === overlayLb) closeLightbox(); }
document.addEventListener('keydown', e => {
  if (overlayLb.style.display !== 'flex') return;
  if (e.key === 'ArrowRight') {
    if (overlay.style.display === 'flex') {
      showNext();
    } else {
      showNextFromWaterfall();
    }
  }
  if (e.key === 'ArrowLeft') {
    if (overlay.style.display === 'flex') {
      showPrev();
    } else {
      showPrevFromWaterfall();
    }
  }
  if (e.key === 'Escape') closeLightbox();
});

// 添加地图加载完成后的提示
map.whenReady(() => {
  console.log('地图加载完成，我的旅行相册');
  updateStats();
});

// 添加键盘快捷键
document.addEventListener('keydown', function(e) {
  // ESC键关闭所有弹窗
  if (e.key === 'Escape') {
    if (overlay.style.display === 'flex') closeGallery();
    if (overlayLb.style.display === 'flex') closeLightbox();
    if (document.getElementById('waterfallOverlay').style.display === 'block') closeWaterfallGallery();
  }
  // 空格键重置视图
  if (e.key === ' ' && !e.target.matches('input, textarea')) {
    e.preventDefault();
    resetView();
  }
});

// 添加鼠标滚轮缩放功能
map.scrollWheelZoom.enable();

// 暴露函数到全局作用域
window.openGallery = openGallery;
window.openWaterfallGallery = openWaterfallGallery;
</script>
